<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>视频加载中...</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { background:#000; height:100%; overflow:hidden; font-family:sans-serif; }
  #v { position:fixed; inset:0; width:100%; height:100%; object-fit:contain; background:#000; transition:opacity 1.2s ease; }
  #v.hide { opacity:0; }
  #t { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; color:#fff; font-size:64px; font-weight:bold; text-align:center; opacity:0; transition:opacity 1.8s ease; pointer-events:none; padding:0 20px; }
  #t.show { opacity:1; }
</style>
</head>
<body>
<video id="v" src="video.mp4" autoplay muted playsinline webkit-playsinline preload="auto"></video>
<div id="t">我是你爸爸</div>
<script>
  var v = document.getElementById('v');
  var t = document.getElementById('t');
  function showText(){ v.classList.add('hide'); t.classList.add('show'); }
  v.addEventListener('ended', showText);
  v.muted = false;
  var p = v.play();
  if (p !== undefined) {
    p.catch(function(){ v.muted = true; v.play().catch(function(){}); });
  }
  document.addEventListener('click', function(){ if (v.paused && !v.ended) { v.play().catch(function(){}); } });
</script>
</body>
</html>
